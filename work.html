<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work — Andy Kim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>

  <header>
    <a class="logo" href="index.html">Andy Kim</a>
    <button class="menu-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="nav-overlay">
    <ul>
      <li><a href="index.html">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="more.html">More</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section class="projects" id="projects"></section>
  </main>

  <script src="projects.js"></script>
  <script src="script.js"></script>
  <script src="footer.js"></script>
  <script>
    const grid = document.getElementById('projects');
    projects.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <a href="project.html?id=${p.id}">
          <div class="project-image">
            <img src="${p.thumbnail}" alt="${p.name}" loading="${i < 2 ? 'eager' : 'lazy'}" />
          </div>
          <div class="project-info">
            <span class="project-label project-name">${p.name}</span>
            <span class="project-tagline">${p.tagline}</span>
          </div>
        </a>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
