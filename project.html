<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Andy Kim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body class="project-page">

  <header>
    <a class="logo" href="index.html">Andy Kim</a>
    <button class="menu-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="nav-overlay">
    <ul>
      <li><a href="index.html">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="more.html">More</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="project-detail">
    <div class="project-detail-header" id="detail-header"></div>
    <div class="project-hero">
      <img id="hero-img" src="" alt="" />
    </div>
    <div class="project-sections" id="project-sections"></div>
    <div class="project-pagination" id="project-pagination"></div>
  </main>

  <script src="projects.js"></script>
  <script src="script.js"></script>
  <script src="footer.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const currentIndex = projects.findIndex(p => p.id === id);
    const project = projects[currentIndex];

    if (!project) { window.location.href = 'index.html'; }

    document.title = `${project.name} — Andy Kim`;

    // Header
    const header = document.getElementById('detail-header');
    header.innerHTML = `
      <h1 class="project-detail-title">${project.name}</h1>
      <p class="project-detail-intro">${project.intro}</p>
      <div class="project-detail-meta">
        <div class="project-detail-meta-item">
          <span class="project-detail-meta-label">Type</span>
          <span class="project-detail-meta-value">${project.type}</span>
        </div>
        <div class="project-detail-meta-item">
          <span class="project-detail-meta-label">Year</span>
          <span class="project-detail-meta-value">${project.year}</span>
        </div>
        <div class="project-detail-meta-item">
          <span class="project-detail-meta-label">Skills</span>
          <span class="project-detail-meta-value">${project.skills}</span>
        </div>
      </div>
    `;

    // Hero
    const heroImg = document.getElementById('hero-img');
    heroImg.src = project.hero;
    heroImg.alt = project.name;

    // Sections
    const sectionsEl = document.getElementById('project-sections');
    project.sections.forEach(section => {
      const block = document.createElement('div');
      block.className = 'section-block';

      let html = `<p class="section-label">${section.label}</p>`;
      if (section.content) {
        html += `<p class="section-text">${section.content}</p>`;
      }
      block.innerHTML = html;
      sectionsEl.appendChild(block);

      if (section.video) {
        const videoWrap = document.createElement('div');
        videoWrap.className = 'section-video';
        videoWrap.innerHTML = `<iframe src="${section.video}" frameborder="0" allowfullscreen loading="lazy"></iframe>`;
        sectionsEl.appendChild(videoWrap);
      }

      if (section.images) {
        section.images.forEach(src => {
          const imgWrap = document.createElement('div');
          imgWrap.className = 'section-image';
          imgWrap.innerHTML = `<img src="${src}" alt="${project.name}" loading="lazy" />`;
          sectionsEl.appendChild(imgWrap);
        });
      }
    });

    // Pagination
    const prev = projects[(currentIndex - 1 + projects.length) % projects.length];
    const next = projects[(currentIndex + 1) % projects.length];
    const pagination = document.getElementById('project-pagination');

    function makeNavCard(p, direction) {
      const a = document.createElement('a');
      a.href = `project.html?id=${p.id}`;
      a.className = `pagination-card pagination-${direction}`;
      a.style.backgroundImage = `url('${p.hero}')`;
      a.innerHTML = `
        <div class="pagination-overlay"></div>
        <div class="pagination-content">
          <span class="pagination-dir">${direction === 'prev' ? '&larr; Previous' : 'Next &rarr;'}</span>
          <span class="pagination-name">${p.name}</span>
        </div>
      `;
      return a;
    }

    pagination.appendChild(makeNavCard(prev, 'prev'));
    pagination.appendChild(makeNavCard(next, 'next'));
  </script>
</body>
</html>
